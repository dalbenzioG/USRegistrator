project: "monai-3d-registration"
# TransMorph3D needs every spatial dim divisible by 32 AND >= 64,
# so the tutorial uses 64^3 instead of the 32^3 used by the generic tutorial.
image_size: [64, 64, 64]

train_dataset:
  name: deepreg_synthetic
  image_size: [64, 64, 64]
  num_samples: 8
  max_disp: 0.2
  cp_spacing: 8
  noise_std: 0.03
  smooth: true
  seed: 123

val_dataset:
  name: deepreg_synthetic
  image_size: [64, 64, 64]
  num_samples: 2
  max_disp: 0.2
  cp_spacing: 8
  noise_std: 0.03
  smooth: true
  seed: 456

model:
  name: transmorph3d
  feature_size: 24   # smaller than the real config (48) to keep the demo fast
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  window_size: 7
  drop_rate: 0.0
  attn_drop_rate: 0.0
  dropout_path_rate: 0.0
  use_checkpoint: false
  warp_mode: bilinear
  warp_padding_mode: border

loss:
  name: lncc_dvf
  kernel_size: 5
  smooth_nr: 1e-4
  smooth_dr: 1e-2
  image_weight: 1.0
  dvf_weight: 0.1

optimizer:
  name: Adam
  lr: 1e-4
  weight_decay: 1e-5

training:
  epochs: 2
  batch_size: 1
  num_workers: 0
  amp: false
  val_every: 1
  seed: 42
  save_dir: "checkpoints/TransMorph3D_tutorial"

wandb:
  enabled: true
  project: "usregistrator"
  run_name: "deepreg_synth_transmorph3d_tutorial"
  offline: true
